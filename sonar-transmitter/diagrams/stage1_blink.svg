<text x="600" y="350" font-size="11" fill="#37474f">onboard MCU LED = GPIO4</text>
<text x="600" y="367" font-size="11" fill="#37474f">(on the board, not a header pin)</text>
<text x="600" y="384" font-size="11" fill="#37474f">Nothing to wire.</text>
<text x="40" y="480" font-size="12" fill="#1a1a18" class="b">Steps</text>
<text x="40" y="498" font-size="11" fill="#37474f">1. Plug the Shrike Lite into the laptop. A charge-only cable will not work: use a data cable.</text>
<text x="40" y="515" font-size="11" fill="#37474f">2. First flash only: if no port appears, hold BOOT while plugging in.</text>
<text x="40" y="532" font-size="11" fill="#37474f">   After that, uploads reset it automatically.</text>
<text x="40" y="549" font-size="11" fill="#37474f">3. Board: Vicharak Shrike-Lite  (FQBN rp2040:rp2040:vicharak_shrike-lite).</text>
<text x="40" y="566" font-size="11" fill="#37474f">4. Upload firmware/stage1_blink. Serial prints "alive" once a second.</text>
<text x="40" y="620" font-size="12" fill="#37474f">Gate: the onboard LED blinks and the serial heartbeat arrives.</text>
