<text x="40" y="120" font-size="11" fill="#37474f">How it works:</text>
<text x="40" y="137" font-size="11" fill="#37474f">firmware/stage2_loopback drives</text>
<text x="40" y="154" font-size="11" fill="#37474f">GPIO16–23 one at a time and reads</text>
<text x="40" y="171" font-size="11" fill="#37474f">IO26. Whichever bus pin the probe</text>
<text x="40" y="188" font-size="11" fill="#37474f">touches reports its own GPIO number.</text>
<text x="40" y="205" font-size="11" fill="#37474f"></text>
<text x="40" y="222" font-size="11" fill="#37474f">Catches: dead pins, swapped pins,</text>
<text x="40" y="239" font-size="11" fill="#37474f">and solder bridges (two pins at once).</text>
<text x="40" y="640" font-size="11.5" fill="#37474f">Serial shows:  probe on GPIO18  OK   verified so far: 16 17 18  (3/8)</text>
<text x="40" y="657" font-size="11.5" fill="#37474f">Gate: "STAGE 2 PASS: all eight DAC bus pins toggle, correct identity, no bridges".</text>
<text x="40" y="674" font-size="11.5" fill="#37474f">A GND pin sits between IO21 and IO20 (red ×). Find pins by their printed LABEL, never by counting.</text>
