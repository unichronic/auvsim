<text x="1060" y="670" font-size="10.5" fill="#37474f" text-anchor="middle">2N2222 plastic TO-92: flat face towards you, legs down = E · B · C.</text>
<text x="1060" y="686" font-size="10.5" fill="#b71c1c" text-anchor="middle" class="b">Check YOUR part's datasheet: metal-can and some clones differ.</text>
<text x="560" y="700" font-size="12" fill="#1a1a18" class="b">Notes</text>
<text x="560" y="718" font-size="11" fill="#37474f">• Firmware: IO27 HIGH powers the turbidity sensor; wait ~100 ms to settle, read, then LOW. Read only while powered.</text>
<text x="560" y="735" font-size="11" fill="#37474f">• IO27 and IO8 are new pin assignments (both were spare): add them to the pin map in COMPONENTS.md.</text>
<text x="560" y="752" font-size="11" fill="#37474f">• Log INA219 power before and after ① and ③: that table is the evidence for the low-power requirement.</text>
