<text x="56" y="136" font-size="13" fill="#1a1a18" class="b">The loop (firmware, every ~100 ms)</text>
<circle cx="70" cy="174" r="13" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.6"/>
<text x="70" y="179" font-size="12" fill="#0d47a1" text-anchor="middle" class="b">1</text>
<text x="94" y="178" font-size="12" fill="#0d47a1" class="b">Read</text>
<text x="94" y="196" font-size="10.5" fill="#37474f">temp (IO5) · turbidity (A0) · depth pot (A1)</text>
<text x="94" y="211" font-size="10.5" fill="#37474f">· TDS (A2) · battery (INA219)</text>
<line x1="70" y1="188" x2="70" y2="236" stroke="#90caf9" stroke-width="2"/>
<circle cx="70" cy="250" r="13" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.6"/>
<text x="70" y="255" font-size="12" fill="#0d47a1" text-anchor="middle" class="b">2</text>
<text x="94" y="254" font-size="12" fill="#0d47a1" class="b">Decide</text>
<text x="94" y="272" font-size="10.5" fill="#37474f">pick a mode from calibrated thresholds with</text>
<text x="94" y="287" font-size="10.5" fill="#37474f">hysteresis, so it never flickers between</text>
<text x="94" y="302" font-size="10.5" fill="#37474f">modes</text>
<line x1="70" y1="264" x2="70" y2="312" stroke="#90caf9" stroke-width="2"/>
<circle cx="70" cy="326" r="13" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.6"/>
<text x="70" y="331" font-size="12" fill="#0d47a1" text-anchor="middle" class="b">3</text>
<text x="94" y="330" font-size="12" fill="#0d47a1" class="b">Pick</text>
<text x="94" y="348" font-size="10.5" fill="#37474f">centre frequency · bandwidth · pulse length</text>
<text x="94" y="363" font-size="10.5" fill="#37474f">· window</text>
<line x1="70" y1="340" x2="70" y2="388" stroke="#90caf9" stroke-width="2"/>
<circle cx="70" cy="402" r="13" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.6"/>
<text x="70" y="407" font-size="12" fill="#0d47a1" text-anchor="middle" class="b">4</text>
<text x="94" y="406" font-size="12" fill="#0d47a1" class="b">Rebuild</text>
<text x="94" y="424" font-size="10.5" fill="#37474f">only if the mode changed: build the new</text>
<text x="94" y="439" font-size="10.5" fill="#37474f">buffer, swap it in at a pulse boundary,</text>
<text x="94" y="454" font-size="10.5" fill="#37474f">never mid-pulse</text>
<line x1="70" y1="416" x2="70" y2="464" stroke="#90caf9" stroke-width="2"/>
<circle cx="70" cy="478" r="13" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.6"/>
<text x="70" y="483" font-size="12" fill="#0d47a1" text-anchor="middle" class="b">5</text>
<text x="94" y="482" font-size="12" fill="#0d47a1" class="b">Set amplitude</text>
<text x="94" y="500" font-size="10.5" fill="#37474f">MCP41010 wiper over SPI: analog, never by</text>
<text x="94" y="515" font-size="10.5" fill="#37474f">scaling samples</text>
<line x1="70" y1="492" x2="70" y2="540" stroke="#90caf9" stroke-width="2"/>
<circle cx="70" cy="554" r="13" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.6"/>
<text x="70" y="559" font-size="12" fill="#0d47a1" text-anchor="middle" class="b">6</text>
<text x="94" y="558" font-size="12" fill="#0d47a1" class="b">Report</text>
<text x="94" y="576" font-size="10.5" fill="#37474f">mode + measured latency over USB serial</text>
<text x="470" y="600" font-size="12" fill="#1a1a18" class="b">Notes</text>
<text x="470" y="618" font-size="11" fill="#37474f">• Demo: stir mud into the water and the waveform on the scope changes by itself. Record it on video.</text>
<text x="470" y="635" font-size="11" fill="#37474f">• Salinity demo (if the TDS sensor arrives): add salt and watch the mode shift.</text>
<text x="470" y="652" font-size="11" fill="#37474f">• Depth changes absorption by only ~3 % at 200 m: justify "deep → low frequency" by the longer range needed.</text>
<text x="470" y="700" font-size="12" fill="#37474f">Gate: mud goes in, waveform changes on its own, and the latency is measured and printed.</text>
</svg>
