<text x="420" y="560" font-size="12" fill="#1a1a18" class="b">Notes</text>
<text x="420" y="578" font-size="11" fill="#37474f">• The 100 Ω in series protects IO25 if a scope lead ever shorts it.</text>
<text x="420" y="595" font-size="11" fill="#37474f">• Both probe ground clips go to GND: never to 3.3 V or 5 V.</text>
<text x="420" y="612" font-size="11" fill="#37474f">• Trigger the scope on CH2 (rising edge); firmware raises IO25 just before each burst.</text>
<text x="420" y="629" font-size="11" fill="#37474f">• Start by bit-banging ~100 kS/s; then move to PIO+DMA at 1 → 5 → 10 MS/s.</text>
<text x="420" y="646" font-size="11" fill="#37474f">Gate: a recognisable stepped sine at the expected frequency (count steps per cycle).</text>
