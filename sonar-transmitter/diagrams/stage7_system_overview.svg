<text x="800" y="564" font-size="10.5" fill="#f57f17" text-anchor="middle" class="sb">IO25 TRIG</text>
<text x="60" y="690" font-size="12" fill="#1a1a18" class="b">What changes in this stage (firmware)</text>
<text x="60" y="708" font-size="11" fill="#37474f">• Build all three modulation types: LFM chirp, geometric sweep, Barker-13 phase code. Make them switchable at runtime.</text>
<text x="60" y="725" font-size="11" fill="#37474f">• Window the chirps (Hann or Blackman; avoid Hamming: it leaves an 8 % step). NEVER window the Barker code: use rectangular.</text>
<text x="60" y="742" font-size="11" fill="#37474f">• Stream the Sim-0 tables (sim/sim0/out/firmware/*.h) and check their CRC-32 on the board; run the clock at 120 or 200 MHz.</text>
<text x="60" y="759" font-size="11" fill="#37474f">Gate: all three types switchable on the scope, plus the rectangular-vs-Hann sidelobe capture for the submission.</text>
</svg>
