<text x="74" y="144" font-size="13" fill="#1e88e5" class="b">Sensors (Stage 3)</text>
<text x="74" y="166" font-size="10.5" fill="#37474f">DS18B20 temp → IO5 (1-Wire)</text>
<text x="74" y="183" font-size="10.5" fill="#37474f">ADS1115: A0 turbidity, A1 depth pot</text>
<text x="74" y="200" font-size="10.5" fill="#37474f">INA219 power monitor</text>
<text x="74" y="217" font-size="10.5" fill="#37474f">I²C: SDA IO6 · SCL IO7</text>
<text x="74" y="234" font-size="10.5" fill="#37474f">3.3 V + 5 V + GND rails</text>
<rect x="60" y="330" width="330" height="150" rx="10" fill="#ffffff" stroke="#6d4c41" stroke-width="2.2" />
<text x="74" y="354" font-size="13" fill="#6d4c41" class="b">Digital pot (Stage 6)</text>
<text x="74" y="376" font-size="10.5" fill="#37474f">MCP41010 on 3.3 V</text>
<text x="74" y="393" font-size="10.5" fill="#37474f">/CS IO9 · SCK IO10 · SI IO11</text>
<text x="74" y="410" font-size="10.5" fill="#37474f">sets amplitude in analog</text>
<rect x="900" y="120" width="420" height="150" rx="10" fill="#ffffff" stroke="#5e35b1" stroke-width="2.2" />
<text x="914" y="144" font-size="13" fill="#5e35b1" class="b">Latch + ladder DAC (Stage 4)</text>
<text x="914" y="166" font-size="10.5" fill="#37474f">IO16–23 → D0–D7 · IO24 → CP (PIO side-set)</text>
<text x="914" y="183" font-size="10.5" fill="#37474f">74HC574 → R-2R ladder → LADDER OUT</text>
<text x="914" y="200" font-size="10.5" fill="#37474f">8-bit, idle code 128 = 1.65 V</text>
<rect x="900" y="320" width="420" height="150" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="2.2" />
<text x="914" y="344" font-size="13" fill="#00897b" class="b">Filter + output amp (Stage 6)</text>
<text x="914" y="366" font-size="10.5" fill="#37474f">Sallen-Key + RC ≈ 700 kHz low-pass</text>
<text x="914" y="383" font-size="10.5" fill="#37474f">digital-pot volume → op-amp B (gain 1.47)</text>
<text x="914" y="400" font-size="10.5" fill="#37474f">47 Ω → BNC (module boundary)</text>
<rect x="900" y="520" width="420" height="110" rx="10" fill="#ffffff" stroke="#0288d1" stroke-width="2.2" />
<text x="914" y="544" font-size="13" fill="#0288d1" class="b">Scope (Stage 5)</text>
<text x="914" y="566" font-size="10.5" fill="#37474f">CH1 ← BNC  ·  CH2 ← TRIG (IO25 via 100 Ω)</text>
<text x="914" y="583" font-size="10.5" fill="#37474f">trigger on CH2 rising edge</text>
